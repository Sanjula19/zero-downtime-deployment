# ─────────────────────────────────────────────────────────────
# Nginx Configuration
# deployment/nginx/nginx.conf
# ─────────────────────────────────────────────────────────────
#
# WHAT THIS DOES:
#   Nginx listens on port 80 (normal web traffic).
#   It forwards all requests to whichever Flask container is active.
#
# HOW TRAFFIC SWITCHING WORKS:
#   Blue active  → upstream points to port 5001
#   Green active → upstream points to port 5002
#
#   switch-traffic.sh changes this line and reloads Nginx.
#   Reload is instant and zero-downtime.
# ─────────────────────────────────────────────────────────────

# 'upstream' defines where to send traffic
# We give it a name 'flask_app' and use it below
upstream flask_app {
    # ↓ This port changes when we switch Blue↔Green
    # Blue = 5001, Green = 5002
    server localhost:5001;

    # keepalive: reuse connections to the container (better performance)
    keepalive 32;
}

server {
    # Listen on port 80 (standard HTTP port)
    listen 80;
    server_name _;   # Accept requests for any hostname

    # Logging (useful when troubleshooting)
    access_log /var/log/nginx/flask-app.access.log;
    error_log  /var/log/nginx/flask-app.error.log;

    # ── Main application ──────────────────────────────────────
    location / {
        proxy_pass http://flask_app;

        # Pass real client IP to our app
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Timeout settings
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ── Nginx health check (for monitoring Nginx itself) ──────
    location /nginx-health {
        access_log off;
        return 200 "nginx OK\n";
        add_header Content-Type text/plain;
    }
}
